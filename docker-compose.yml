services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD est manquante, copie .env.example vers .env et renseigne-la.}
    ports:
      # Port publie sur la machine hote. 5432 est souvent deja pris par un autre
      # projet : POSTGRES_PORT permet de le deplacer sans toucher au compose.
      # Le port interne reste 5432 — c'est celui que l'API utilise dans le reseau Docker.
      # Lie a 127.0.0.1 : la base n'est joignable que depuis cette machine, pas depuis
      # le reseau local (sinon Docker publie sur toutes les interfaces).
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Outil d'administration, démarré seulement sur demande : docker compose --profile outils up
  pgadmin:
    # Version epinglee : "latest" changeait de version a chaque pull, sans controle.
    image: dpage/pgadmin4:9.18
    profiles: ["outils"]
    container_name: inventory-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inventory.local
      # pgAdmin 9 refuse par défaut les domaines réservés comme .local
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?La variable PGADMIN_PASSWORD est manquante, copie .env.example vers .env et renseigne-la.}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: src/Backend/InventorySystem.Api/Dockerfile
    container_name: inventory-api
    environment:
      # Compose de développement local uniquement : Development active l'inscription libre,
      # les comptes de démonstration et Swagger. Ne jamais l'utiliser tel quel sur un serveur.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=inventory;Username=inventory;Password=${POSTGRES_PASSWORD}"
      # Jamais commité — voir .env.example. En local (hors Docker), la même clé vient
      # de `dotnet user-secrets` (voir InventorySystem.Api.csproj).
      Jwt__Key: ${JWT_KEY:?La variable JWT_KEY est manquante — copie .env.example vers .env et renseigne-la (voir README).}
      # appsettings.Development.json active les comptes de demonstration et l'inscription
      # libre. Cette base locale peut contenir des donnees reelles : on neutralise les deux
      # ici (une valeur vide suffit, DemoUserSeeder ne cree alors aucun compte).
      Seed__DemoPassword: ""
      Registration__PublicEnabled: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./src/Frontend
      args:
        # Le navigateur tourne sur la machine hôte (pas dans le réseau Docker) : il doit
        # cibler le port publié de l'API sur localhost, pas le nom de service "api".
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: inventory-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
