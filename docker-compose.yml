services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?La variable POSTGRES_PASSWORD est manquante, copie .env.example vers .env et renseigne-la.}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inventory-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inventory.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?La variable PGADMIN_PASSWORD est manquante, copie .env.example vers .env et renseigne-la.}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: src/Backend/InventorySystem.Api/Dockerfile
    container_name: inventory-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=inventory;Username=inventory;Password=${POSTGRES_PASSWORD}"
      # Jamais commité — voir .env.example. En local (hors Docker), la même clé vient
      # de `dotnet user-secrets` (voir InventorySystem.Api.csproj).
      Jwt__Key: ${JWT_KEY:?La variable JWT_KEY est manquante — copie .env.example vers .env et renseigne-la (voir README).}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./src/Frontend
      args:
        # Le navigateur tourne sur la machine hôte (pas dans le réseau Docker) : il doit
        # cibler le port publié de l'API sur localhost, pas le nom de service "api".
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: inventory-frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
