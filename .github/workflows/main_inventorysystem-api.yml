# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - inventorysystem-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        # Cible explicitement le projet API : le repo contient aussi le frontend React et
        # les projets .NET MAUI (mobile), qui nécessitent des workloads non installés sur ce
        # runner et n'ont rien à faire dans le déploiement de l'API.
        run: dotnet build src/Backend/InventorySystem.Api/InventorySystem.Api.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish src/Backend/InventorySystem.Api/InventorySystem.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E20847BB240D475F8C0CAE1D73B280E0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_44D5FE53AF3040A89E2714373687900F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_75FC696A96DC42D6B62B2FD90CAF9B9D }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'inventorysystem-api'
          slot-name: 'Production'
          package: .
          