name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permet de relancer manuellement depuis l'onglet Actions, sans nouveau commit

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InventorySystem.slnx

      - name: Build
        run: dotnet build InventorySystem.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Backend.UnitTests/InventorySystem.Backend.UnitTests.csproj --no-build --configuration Release --verbosity normal

      # Les tests d'intégration (Testcontainers) tournent aussi ici : Docker est dispo sur ubuntu-latest.
      - name: Integration tests
        run: dotnet test tests/Backend.IntegrationTests/InventorySystem.Backend.IntegrationTests.csproj --configuration Release --verbosity normal

  frontend:
    name: Frontend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test --if-present

  mobile-unit-tests:
    name: Mobile (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # InventoryMobile.Infrastructure (référencé par ce projet de tests) cible net10.0 pur,
      # sans dépendance MAUI : aucun workload à installer ici, contrairement aux jobs de
      # build ci-dessous.
      - name: Restore
        run: dotnet restore tests/Mobile.UnitTests/InventoryMobile.Mobile.UnitTests.csproj

      - name: Test
        run: dotnet test tests/Mobile.UnitTests/InventoryMobile.Mobile.UnitTests.csproj --no-restore --configuration Release --verbosity normal

  mobile-build-android:
    name: Mobile (build Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build
        run: dotnet build src/Mobile/InventoryMobile/InventoryMobile.csproj -f net10.0-android --configuration Release

  mobile-build-windows:
    name: Mobile (build Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build
        run: dotnet build src/Mobile/InventoryMobile/InventoryMobile.csproj -f net10.0-windows10.0.19041.0 --configuration Release
