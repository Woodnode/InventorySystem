server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité : pas de devinette du type MIME, pas d'affichage dans une iframe
    # (clickjacking), et une URL complète jamais transmise à un autre site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # React Router (client-side routing) : toute route inconnue retombe sur index.html
    # plutôt qu'un 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
